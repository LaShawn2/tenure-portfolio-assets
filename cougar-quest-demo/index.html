 {id:'01',kind:'normal',number:1,from:1,to:4,move:3,label:'Course Question 1 of 3'},
 {id:'03',kind:'normal',number:2,from:4,to:7,move:3,label:'Course Question 2 of 3'},
 {id:'05',kind:'trap',number:1,from:7,to:7,move:0,label:'Trap Challenge'},
 {id:'18',kind:'normal',number:3,from:7,to:15,move:8,label:'Course Question 3 of 3'},
 {id:'38',kind:'shortcut',number:1,from:15,to:23,move:8,label:'Shortcut Challenge'}
];
const SPECIALS={
 7:{type:'trap',label:'Caught by Trappers',image:'trap'},
 15:{type:'shortcut',label:'Go to the Den',image:'shortcut'}
};
const HELP_SECTIONS={course:['01'],communication:['03'],submissions:['05'],participation:['18'],integrity:['38']};
const initial=()=>({screen:'choose',piece:null,position:1,planIndex:0,regularCorrect:0,cardsCompleted:0,attempts:0,lastMove:'—',lastDelta:0,questionId:null,selected:null,correct:null,context:'normal',pendingSpecial:null,animateFrom:null,won:false});
let state=initial();
try{
 const saved=localStorage.getItem(KEY);
 if(saved){const p=JSON.parse(saved);if(p&&['choose','board','question','feedback','special','win'].includes(p.screen))state={...initial(),...p}}
}catch(e){saveStatus.textContent='Progress storage unavailable'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveStatus.textContent='Progress saved in this browser'}catch(e){saveStatus.textContent='Progress saving unavailable'}}
function setMessage(s){message.textContent=s}
function currentStep(){return DEMO_PLAN[Math.min(state.planIndex,DEMO_PLAN.length-1)]}
function openSyllabus(cardId){const section=Object.keys(HELP_SECTIONS).find(key=>HELP_SECTIONS[key].includes(String(cardId)))||'course';byId('syllabus-frame').src='game_syllabus.html#'+section;byId('syllabus-dialog').hidden=false;byId('syllabus-close').focus()}
function closeSyllabus(){byId('syllabus-dialog').hidden=true}
function background(src){return `<img class="background" alt="" src="${src}">`}
function askStep(){
 const step=currentStep();state.questionId=step.id;state.selected=null;state.correct=null;state.context=step.kind;state.screen='question';save();
 setMessage(step.kind==='normal'?`${step.label}: choose an answer.`:`${step.label}: answer one question to continue.`);render();
}
function draw(){const button=byId('draw');button.disabled=true;stage.querySelector('.deck-large').classList.add('flipping');setTimeout(askStep,350)}
function landOn(destination,label,triggerSpecial=false){
 const previous=state.position;state.position=destination;state.animateFrom=previous!==destination?previous:null;state.lastMove=label;state.lastDelta=destination-previous;
 state.pendingSpecial=triggerSpecial&&SPECIALS[destination]?destination:null;state.screen='board';save();setMessage(label);render();
}
function openSpecial(){state.pendingSpecial=null;state.screen='special';save();render()}
function win(){
 state.position=23;state.won=true;state.screen='win';state.pendingSpecial=null;state.lastMove='Shortcut to the Cougar Den';state.lastDelta=8;save();setMessage('Demo complete. Cougar Den reached.');render();
}
function resolveCorrect(){
 const step=currentStep();state.cardsCompleted++;if(step.kind==='normal')state.regularCorrect++;
 if(step.kind==='normal' && step.to===7){state.planIndex++;landOn(7,'Correct: move +3 to the Trap at space 7.',true);return}
 if(step.kind==='normal' && step.to===15){state.planIndex++;landOn(15,'Correct: move +8 to the Shortcut at space 15.',true);return}
 if(step.kind==='normal'){state.planIndex++;landOn(step.to,`Correct: move +${step.move} to space ${step.to}.`,false);return}
 if(step.kind==='trap'){
  state.planIndex++;state.lastMove='Trap escaped after one correct challenge';state.lastDelta=0;state.screen='board';save();setMessage('Trap escaped. Flip the next card to continue toward the Shortcut.');render();return
 }
 if(step.kind==='shortcut'){
  state.planIndex++;state.animateFrom=15;win();return
 }
}
function resolveAnswer(){
 state.attempts++;
 if(!state.correct){state.selected=null;state.correct=null;state.screen='question';save();setMessage('Incorrect. Review the feedback and try the same card again. No backward movement in this portfolio demo.');render();return}
 resolveCorrect();
}
function render(){
 const a=DATA.assets;stage.className='stage '+state.screen+(state.screen==='special'&&SPECIALS[state.position]?' special-'+SPECIALS[state.position].type:'');
 if(state.screen==='choose'){
  stage.innerHTML=`<img class="start-art" src="${a.start}" alt="Cougar on the Columbus State campus"><h2 class="start-title"><span>COUGAR</span><span>COURSE QUEST</span><small>TENURE PORTFOLIO DEMO</small></h2><div class="how-to"><h2>HOW TO PLAY</h2><ul><li>This abbreviated demo uses 3 course questions.</li><li>Movement is fixed so you will experience both featured special spaces.</li><li>The Trap requires 1 question to escape.</li><li>The Shortcut requires 1 question to activate.</li><li>Incorrect answers retry the same card; there is no backward movement.</li><li>Complete all 5 cards to reach the Cougar Den.</li></ul><div class="pick-label">CHOOSE YOUR COUGAR</div></div><div class="start-choices">${['blue','red','green','gold'].map((color,i)=>`<button type="button" class="start-piece ${state.piece===color?'selected':''}" data-piece="${color}" aria-label="Choose ${color} cougar" aria-pressed="${state.piece===color}"><div class="portrait" style="background-image:url('${a.cougarStrip}');background-position:${i*100/3}% center"></div><span>${color.toUpperCase()}</span></button>`).join('')}</div><button type="button" class="start-begin" id="start">START DEMO</button>`;
  stage.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{state.piece=b.dataset.piece;save();render()});
  byId('start').onclick=()=>{if(!state.piece){setMessage('Choose a cougar first.');return}state.screen='board';save();setMessage('Flip the first card.');render()};
 }
 if(state.screen==='board'){
  const [x,y]=DATA.positions[state.position];const [sx,sy]=DATA.positions[state.animateFrom??state.position];const step=currentStep();
  stage.innerHTML=`<div class="scene"><div class="board-area"><img src="${a.board}" alt="Cougar Den forest scene" style="position:absolute;left:10.4%;top:15.93%;width:79.2%;height:68.13%;object-fit:cover">
   ${DATA.tiles.map(t=>{const [l,top,r,b]=t.box;return `<img class="tile" src="${t.img}" alt="" style="left:${Math.min(l,r)/9.6}%;top:${Math.min(top,b)/6.75}%;width:${Math.abs(r-l)/9.6}%;height:${Math.abs(b-top)/6.75}%;${r<l?'transform:scaleX(-1)':''}">`}).join('')}
   ${DATA.tiles.filter(t=>[2,3,4,6,8,10,11,13,14,16,17,18,20,21,22].includes(t.pos)).map(t=>{const [l,top,r,b]=t.box;return `<span class="tile-label" style="left:${(l+r)/19.2}%;top:${(top+b)/13.5}%"><b>${t.pos}</b>QUESTION</span>`}).join('')}
   <img class="token" id="player-token" src="${a.tokens[state.piece]}" alt="Your ${state.piece} cougar at space ${state.position}" style="left:${sx/9.6}%;top:${sy/6.75}%"></div>
   <aside class="sidebar"><div class="status-box"><strong>PORTFOLIO DEMO</strong>Space: ${state.position}<br>Course questions: ${state.regularCorrect} / 3<br>Demo cards: ${state.cardsCompleted} / 5<br>Last move: ${state.lastDelta>0?'+':''}${state.lastDelta||'—'}</div><div class="deck-large"><img src="${a.cardBack}" alt="Question card deck"><button type="button" id="draw" aria-label="Flip the next demo card">Flip a card</button></div></aside>
   ${state.pendingSpecial?`<div class="landing-notice">You landed on ${SPECIALS[state.pendingSpecial].label}.<br><button type="button" id="view-special">View special space</button></div>`:''}</div>`;
  if(state.animateFrom!==null){const token=byId('player-token');requestAnimationFrame(()=>{token.style.left=`${x/9.6}%`;token.style.top=`${y/6.75}%`});state.animateFrom=null;save()}
  byId('draw').onclick=()=>{if(state.pendingSpecial){setMessage('View the special space first.');return}if(step.kind!=='normal'){setMessage('Open the special space to continue.');return}draw()};
  if(state.pendingSpecial)byId('view-special').onclick=openSpecial;
 }
 if(state.screen==='question'){
  const q=DATA.questions[state.questionId];const step=currentStep();
  const banner=step.kind==='normal'?`${step.label} · Correct answer moves +${step.move}`:step.kind==='trap'?'TRAP CHALLENGE · 1 correct answer to escape':'SHORTCUT CHALLENGE · 1 correct answer sends you to the Cougar Den';
  stage.innerHTML=`<section class="scene" aria-label="${banner}"><div class="media-frame">${background(a.question)}<div class="question-text">${q.question}</div><div class="challenge-banner" role="status">${banner}</div>${['A','B','C','D'].map(c=>`<button type="button" class="answer answer-${c.toLowerCase()} ${state.selected===c?'selected':''}" data-answer="${c}" aria-pressed="${state.selected===c}">${q[c]}</button>`).join('')}<button type="button" id="submit" class="submit" aria-label="Submit answer">Submit</button></div></section>`;
  stage.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.answer;save();render()});
  byId('submit').onclick=()=>{if(!state.selected){setMessage('Choose A, B, C, or D before submitting.');return}state.correct=state.selected===q.correct;state.screen='feedback';save();render()};
 }
 if(state.screen==='feedback'){
  const step=currentStep();const context=`<div class="challenge-feedback" role="status">${state.correct?'Correct':'Incorrect'} · ${step.label}</div>`;
  stage.innerHTML=`<div class="media-frame">${background(state.correct?a.correct:a.wrong)}</div>${context}${state.correct?'':`<button type="button" id="feedback-help" class="feedback-hotspot help-hotspot" aria-label="Hint: view syllabus"></button>`}<button type="button" id="continue" class="feedback-hotspot ${state.correct?'correct-continue':'wrong-continue'}" aria-label="${state.correct?'Continue':'Try this card again'}"></button>`;
  if(!state.correct)byId('feedback-help').onclick=()=>openSyllabus(state.questionId);byId('continue').onclick=resolveAnswer;
 }
 if(state.screen==='special'){
  const special=SPECIALS[state.position];const step=currentStep();
  const instruction=special.type==='trap'?'Answer one challenge card correctly to escape.':'Answer one challenge card correctly to activate the Shortcut and jump to the Cougar Den.';
  stage.innerHTML=`<div class="special-frame"><img src="${a[special.image]}" alt="${special.label}"></div><div class="special-details"><strong>${special.label}</strong><br>${instruction}<button type="button" id="special-continue" class="special-action">Flip challenge card</button></div>`;
  byId('special-continue').onclick=()=>{byId('special-continue').disabled=true;stage.querySelector('.special-frame').classList.add('flipping');setTimeout(askStep,350)};
 }
 if(state.screen==='win'){
  stage.innerHTML=`<div class="special-frame"><img src="${a.win}" alt="Cougar Den: demo complete"></div><div class="win-panel"><strong>Demo Complete</strong><br><br>You have completed the Cougar Course Quest portfolio demonstration.<br><br>This abbreviated version highlights the question system, feedback and hint structure, board navigation, Trap challenge, Shortcut mechanic, and completion experience used in the full student activity.<br><br><b>5 demo cards completed</b><br>Final route: 1 → 4 → 7 → 15 → 23<div class="win-actions"><button type="button" id="restart-demo">Replay Demo</button></div></div>`;
  byId('restart-demo').onclick=()=>{state=initial();save();setMessage('Demo restarted. Choose your cougar.');render()};
 }
}
byId('syllabus-close').onclick=closeSyllabus;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!byId('syllabus-dialog').hidden)closeSyllabus()});
byId('reset').onclick=()=>{state=initial();save();setMessage('Demo restarted. Choose your cougar.');render()};
save();render();
</script></body></html>
