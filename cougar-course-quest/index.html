function randomInt(n){if(globalThis.crypto&&crypto.getRandomValues){const array=new Uint32Array(1);crypto.getRandomValues(array);return array[0]%n}return Math.floor(Math.random()*n)}
function choice(list){return list[randomInt(list.length)]}
function nextQuestion(){
 if(!state.deck.length){const ids=Object.keys(DATA.questions);for(let i=ids.length-1;i>0;i--){const j=randomInt(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}state.deck=ids}
 return state.deck.pop();
}
function ask(context){state.questionId=nextQuestion();state.selected=null;state.correct=null;state.context=context;state.screen='question';save();setMessage('Choose an answer, then submit.');render()}

function randomMove(direction){
 const steps=[1,2,3];const candidates=steps.filter(n=>{const target=Math.max(1,Math.min(23,state.position+direction*n));return !SPECIALS[target]||!state.specialCooldown});
 return choice(candidates.length?candidates:steps);
}
function sendCompletion(){state.completionSent=true;save()}
function win(){
 if(state.correctAnswers<MAX_CORRECT){landOn(22,'Almost there: answer more questions to reach 15 correct.',false);return}
 if(!state.won){state.won=true;state.wonAt=new Date().toISOString();state.code='CCQ-'+String(1000+randomInt(9000));state.receiptId=Array.from({length:12},()=>randomInt(16).toString(16)).join('').toUpperCase();state.screen='win';state.pendingSpecial=null;save();sendCompletion()}else{state.screen='win';save()}

}
function landOn(next,label,triggerSpecial=true){
 const previous=state.position;let destination=Math.max(1,Math.min(23,next));
 if(destination===23){if(state.correctAnswers>=MAX_CORRECT){state.position=23;state.lastDelta=23-previous;state.lastMove=label;win();return}destination=22;label=`Almost there: ${state.correctAnswers} of 15 correct. ${15-state.correctAnswers} more needed.`}
 state.position=destination;state.animateFrom=previous!==destination?previous:null;
 state.lastMove=label;state.lastDelta=destination-previous;
 state.pendingSpecial=triggerSpecial&&SPECIALS[destination]?destination:null;
 state.screen=destination===22?'almost':'board';save();setMessage(label);render();
}
function openSpecial(){
 const special=SPECIALS[state.position];if(!special)return;
 state.pendingSpecial=null;

 state.screen='special';save();render();
}
function resolveSpecial(){
 const pos=state.position;const special=SPECIALS[pos];if(!special)return;
 if(special.type==='reward'){
  const valid=[1,2,3].filter(n=>!SPECIALS[pos+n]);const move=choice(valid.length?valid:[1,2,3]);state.specialCooldown=true;
  landOn(pos+move,`Reward: moved forward ${move} to space ${pos+move}.`,false);return;
 }
 if(special.type==='shortcut'){state.specialCooldown=true;landOn(23,'Shortcut to the Cougar Den.',false);return}
}
function finishChallenge(destination,label){state.challenge=null;state.specialCooldown=true;landOn(destination,label,false)}
function resolveChallenge(correct){
 const c=state.challenge;c.asked++;
 if(c.type==='office'){
  if(c.phase==='fourth'){
   if(correct){finishChallenge(23,'Office Hours: fourth answer correct. Head to the Cougar Den.');return}
   finishChallenge(22,'Office Hours: fourth answer incorrect. Continue at space 22.');return;
  }
  if(correct){c.streak++;c.wrongRun=0;if(c.streak===3)c.phase='fourth'}
  else{c.streak=0;c.wrongRun++}
  if(c.wrongRun>=2){finishChallenge(22,'Office Hours: two wrong answers in a row. Continue at space 22.');return}
  if(c.asked>=8){finishChallenge(19,'Office Hours: eight questions reached. Resume at space 19.');return}
  state.screen='special';save();render();return;
 }
 if(correct){c.streak++;if(c.streak>=3){finishChallenge(state.position,`${SPECIALS[state.position].label}: three correct in a row. Your token is free.`);return}}
 else{c.streak=0;c.failed++;if(c.failed>=2){finishChallenge(state.position,`${SPECIALS[state.position].label}: two tries used. You are free to move. Read the syllabus for help.`);return}}
 state.screen='special';save();render();
}
function resolveAnswer(){
 const correct=state.correct;state.cardsAnswered++;if(correct){state.correctAnswers++;state.score++}
 if(state.context!=='normal'){resolveChallenge(correct);return}
 const amount=randomMove(correct?1:-1),destination=Math.max(1,Math.min(23,state.position+(correct?amount:-amount)));
 const triggerSpecial=!state.specialCooldown;state.specialCooldown=false;
 landOn(destination,`${correct?'Correct':'Incorrect'}: ${correct?'forward':'back'} ${amount} to space ${destination}.`,triggerSpecial);
}
function challengeText(c){
 if(c.type==='office')return c.phase==='fourth'?`3 in a row complete! Answer this fourth question correctly to go to the Den. Question ${Math.min(c.asked+1,8)} of 8.`:`${3-c.streak} correct in a row needed; then answer a fourth question. ${c.wrongRun} of 2 wrong in a row. Question ${Math.min(c.asked+1,8)} of 8.`;
 return `${3-c.streak} correct in a row to escape. ${c.failed} of 2 failed tries. A wrong answer starts a new try.`;
}
function receiptText(){return `COUGAR COURSE QUEST — COMPLETION RECEIPT\nCompletion code: ${state.code}\nReceipt ID: ${state.receiptId}\nCompleted (UTC): ${state.wonAt}\nCorrect answers: ${state.correctAnswers}\nCards answered: ${state.cardsAnswered}\nGame score: ${state.score}\n\nSave this receipt and a screenshot of the completion screen for your records. This standalone web version does not report grades automatically to Blackboard.\n`}
function downloadReceipt(){

  stage.innerHTML=`<div class="scene"><div class="board-area"><img src="${a.board}" alt="Cougar Den forest scene" style="position:absolute;left:10.4%;top:15.93%;width:79.2%;height:68.13%;object-fit:cover">
   ${DATA.tiles.map(t=>{const [l,top,r,b]=t.box;return `<img class="tile" src="${t.img}" alt="" style="left:${Math.min(l,r)/9.6}%;top:${Math.min(top,b)/6.75}%;width:${Math.abs(r-l)/9.6}%;height:${Math.abs(b-top)/6.75}%;${r<l?'transform:scaleX(-1)':''}">`}).join('')}
   ${DATA.tiles.filter(t=>[2,3,4,6,8,10,11,13,14,16,17,18,20,21,22].includes(t.pos)).map(t=>{const [l,top,r,b]=t.box;return `<span class="tile-label" style="left:${(l+r)/19.2}%;top:${(top+b)/13.5}%"><b>${t.pos}</b>QUESTION</span>`}).join('')}
   <div class="board-title">COUGAR COURSE QUEST</div><img class="token" id="player-token" src="${a.tokens[state.piece]}" alt="Your ${state.piece} cougar at space ${state.position}" style="left:${sx/9.6}%;top:${sy/6.75}%"></div>
   <aside class="sidebar"><div class="status-box"><strong>GAME STATUS</strong>Space: ${state.position}<br>Game score: ${state.score}<br>Cards: ${state.cardsAnswered}<br>Correct: ${state.correctAnswers} / 15<br>Last move: ${state.lastDelta>0?'+':''}${state.lastDelta||'—'}</div><div class="deck-large"><img src="${a.cardBack}" alt="Question card deck"><button type="button" id="draw" aria-label="Flip a question card">Flip a card</button></div></aside>
   ${state.pendingSpecial?`<div class="landing-notice">You landed on ${SPECIALS[state.pendingSpecial].label}.<br><button type="button" id="view-special">View special space</button></div>`:''}</div>`;
  if(state.animateFrom!==null){const token=byId('player-token');requestAnimationFrame(()=>{token.style.left=`${x/9.6}%`;token.style.top=`${y/6.75}%`});state.animateFrom=null;save()}
  byId('draw').onclick=()=>{if(state.pendingSpecial){setMessage('View the special space first.');return}draw()};
  if(state.pendingSpecial)byId('view-special').onclick=openSpecial;
 }
 if(state.screen==='question'){
  const q=DATA.questions[state.questionId];const challenge=state.context!=='normal'&&state.challenge;
  stage.innerHTML=`<section class="scene" aria-label="Question ${state.questionId}"><div class="media-frame">${background(a.question)}<div class="question-text">${q.question}</div>${challenge?`<div class="challenge-banner" role="status">${challengeText(challenge)}</div>`:''}${['A','B','C','D'].map(c=>`<button type="button" class="answer answer-${c.toLowerCase()} ${state.selected===c?'selected':''}" data-answer="${c}" aria-pressed="${state.selected===c}">${q[c]}</button>`).join('')}<button type="button" id="submit" class="submit" aria-label="Submit answer">Submit</button></div></section>`;
  stage.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.answer;save();render()});
  byId('submit').onclick=()=>{if(!state.selected){setMessage('Choose A, B, C, or D before submitting.');return}state.correct=state.selected===q.correct;state.screen='feedback';save();render()};
 }
 if(state.screen==='feedback'){
  const context=state.context==='normal'?'':`<div class="challenge-feedback" role="status">${state.correct?'Correct':'Incorrect'} · ${state.challenge.type==='office'?'Office Hours':state.challenge.type==='trap'?'Trapper':'Blackboard Woods'}</div>`;
  stage.innerHTML=`<div class="media-frame">${background(state.correct?a.correct:a.wrong)}</div>${context}${state.correct?'':`<button type="button" id="feedback-help" class="feedback-hotspot help-hotspot" aria-label="Hint: view syllabus"></button>`}<button type="button" id="continue" class="feedback-hotspot ${state.correct?'correct-continue':'wrong-continue'}" aria-label="Continue"></button>`;
  if(!state.correct)byId('feedback-help').onclick=()=>openSyllabus(state.questionId);byId('continue').onclick=resolveAnswer;
 }
 if(state.screen==='special'){
  const special=SPECIALS[state.position],c=state.challenge;
  stage.innerHTML=`<div class="special-frame"><img src="${a[special.image]}" alt="${special.label}"></div>${special.type==='reward'?'<button type="button" id="reward-great" class="reward-great" aria-label="Great! Claim your reward (click anywhere on this slide)"></button>':`<div class="special-details"><strong>${special.label}</strong><br>${c?challengeText(c):'Take a shortcut toward the Den.'}<button type="button" id="special-continue" class="special-action">${c?'Flip challenge card':'Continue'}</button></div>`}`;
  if(special.type==='reward')byId('reward-great').onclick=resolveSpecial;
  else byId('special-continue').onclick=()=>{if(c){byId('special-continue').disabled=true;stage.querySelector('.special-frame').classList.add('flipping');setTimeout(()=>ask(c.type),450)}else resolveSpecial()};
 }
 if(state.screen==='almost'){
  stage.innerHTML=`<div class="scene"><img class="almost-art" src="${a.board}" alt=""><div class="almost-panel" role="status"><h2>ALMOST THERE!</h2><p>You have <strong>${state.correctAnswers} of 15 correct answers</strong>. ${Math.max(0,15-state.correctAnswers)} more needed to win.</p><p>Continue playing from space 22. Reach the Cougar Den after earning 15 correct answers.</p><button type="button" id="almost-continue" class="special-action">Continue from space 22</button></div></div>`;
  byId('almost-continue').onclick=()=>{state.screen='board';save();render()};
 }
 if(state.screen==='win'){
  stage.innerHTML=`<div class="special-frame"><img src="${a.win}" alt="Cougar Den: You win!"></div><div class="win-panel"><strong>COURSE QUEST COMPLETE</strong><br>15 correct answers achieved<br>Completion code: <b>${state.code}</b><br>Receipt ID: ${state.receiptId}<br>Game score: ${state.score} · Correct answers: ${state.correctAnswers} of 15<br><small>This standalone web version saves progress in this browser. Download your completion receipt and take a screenshot for your records.</small><div class="win-actions"><button type="button" id="download-receipt">Download receipt</button><button type="button" id="replay-game">Replay Game</button></div></div>`;
  byId('download-receipt').onclick=downloadReceipt;byId('replay-game').onclick=()=>{state=initial();save();setMessage('New game started. Choose your cougar.');render()};
 }
}
byId('syllabus-close').onclick=closeSyllabus;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!byId('syllabus-dialog').hidden)closeSyllabus()});
byId('reset').onclick=()=>{state=initial();save();setMessage('New game started. Choose your cougar.');render()};
save();render();
</script></body></html>
